# Zastal Store — HTTPS reverse proxy. Adjust server_name and certificate paths.
server {
    listen 443 ssl http2;
    server_name zastalstore.51-15-21-164.sslip.io;
    # ssl_certificate /etc/letsencrypt/live/<host>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<host>/privkey.pem;

    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Payment notifications: PayU servers only need this path; keep a generous but bounded rate.
    location = /api/payments/payu/notify {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8879;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
server {
    listen 80;
    server_name zastalstore.51-15-21-164.sslip.io;
    return 301 https://$host$request_uri;
}
